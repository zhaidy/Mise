name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MISE_KEYSTORE_PASSWORD: ${{ secrets.MISE_KEYSTORE_PASSWORD }}
      MISE_KEY_ALIAS: ${{ secrets.MISE_KEY_ALIAS }}
      MISE_KEY_PASSWORD: ${{ secrets.MISE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 生成更新说明要用到之前的 build-* 标签和提交历史
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # 默认还会装已下架的 "tools" 包而失败；SDK 平台由 Gradle 按需下载
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      # 固定签名密钥放在 Secrets 里；没配置时退回调试签名（此时 APK 不能覆盖安装旧版）
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MISE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mise.keystore"
            echo "MISE_KEYSTORE_FILE=$RUNNER_TEMP/mise.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::MISE_KEYSTORE_BASE64 未配置，使用调试签名"
          fi
      # 打印签名证书指纹，在 Android Developer Console 登记应用时要用（指纹是公开信息）
      - name: Print signing certificate fingerprint
        if: env.MISE_KEYSTORE_FILE != ''
        run: |
          keytool -list -v -keystore "$MISE_KEYSTORE_FILE" -storepass "$MISE_KEYSTORE_PASSWORD" -alias "$MISE_KEY_ALIAS" \
            | grep -E 'SHA1:|SHA256:' | sed 's/^[[:space:]]*/::notice title=签名证书指纹::/'
      # Firebase 配置放在 Secrets 里，不进仓库
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON 未配置"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - run: chmod +x gradlew && ./gradlew assembleRelease testDebugUnitTest
      - run: mv app/build/outputs/apk/release/app-release.apk mise.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mise-apk
          path: mise.apk
      # 只有 main 上的构建才发 Release，应用内“检查更新”读的就是最新的这个
      # 更新说明：上一个 build-* 标签之后 main 上的提交标题，应用内更新弹窗会显示
      - name: Release notes
        if: github.ref == 'refs/heads/main' && env.MISE_KEYSTORE_FILE != ''
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'build-*' HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="-1"; fi
          git log $range --no-merges --format='%s' | sed -E 's/ \(#[0-9]+\)$//; s/^/- /' > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.MISE_KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mise build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/notes.md
          files: mise.apk
          make_latest: true
